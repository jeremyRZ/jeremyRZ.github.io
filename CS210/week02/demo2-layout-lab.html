<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XML Layout Lab · CS210</title><link rel="icon" href="data:,"><link rel="stylesheet" href="week02.css"></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← Lecture 2 Demos</a><span class="count">DEMO 02 · XML LAYOUT</span></div><header class="hero"><div class="eyebrow">CODE AND RESULT</div><h1>XML Layout Lab</h1><p>Change an attribute and observe both the XML and the rendered component.</p></header><main class="stage"><section class="panel"><div class="panel-head"><span>ATTRIBUTE CONTROLS</span><span>activity_main.xml</span></div><div class="panel-body"><label class="label">Button width</label><div class="controls" id="widths"><button class="btn active" data-width="wrap_content">wrap_content</button><button class="btn" data-width="match_parent">match_parent</button></div><label class="label">Alignment</label><div class="controls" id="aligns"><button class="btn active" data-align="center">center</button><button class="btn" data-align="flex-start">start</button><button class="btn" data-align="flex-end">end</button></div><label class="label" for="textInput">Button text</label><input class="btn" id="textInput" value="Find Beer!" maxlength="24"><pre class="code" id="xml"></pre></div></section><section class="panel"><div class="panel-head"><span>DEVICE PREVIEW</span><span>LIVE</span></div><div class="panel-body"><div class="phone"><div class="phone-bar">Beer Adviser</div><div class="screen" id="screen"><select class="spinner"><option>light</option><option>amber</option><option>brown</option><option>dark</option></select><button class="android-btn" id="previewBtn">FIND BEER!</button><div class="result">No beers selected</div></div></div><div class="note" id="lesson">wrap_content makes the Button only as wide as its content.</div></div></section></main></div><script>const widths=document.getElementById('widths');const aligns=document.getElementById('aligns');const textInput=document.getElementById('textInput');const xml=document.getElementById('xml');const screen=document.getElementById('screen');const previewBtn=document.getElementById('previewBtn');const lesson=document.getElementById('lesson');let state={width:'wrap_content',align:'center',text:'Find Beer!'};const render=()=>{xml.textContent=`<Button\n  android:id="@+id/find_beer"\n  android:layout_width="${state.width}"\n  android:layout_height="wrap_content"\n  android:layout_gravity="${state.align==='flex-start'?'start':state.align==='flex-end'?'end':'center'}"\n  android:text="${state.text.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}" />`;previewBtn.textContent=state.text;previewBtn.style.width=state.width==='match_parent'?'100%':'auto';previewBtn.style.alignSelf=state.align;lesson.textContent=state.width==='match_parent'?'match_parent stretches the Button across the available width.':'wrap_content makes the Button only as wide as its content.'};document.body.onclick=e=>{if(e.target.dataset.width){state.width=e.target.dataset.width;document.querySelectorAll('[data-width]').forEach(x=>x.classList.toggle('active',x===e.target));render()}if(e.target.dataset.align){state.align=e.target.dataset.align;document.querySelectorAll('[data-align]').forEach(x=>x.classList.toggle('active',x===e.target));render()}};textInput.oninput=e=>{state.text=e.target.value||' ';render()};render()</script></body></html>
