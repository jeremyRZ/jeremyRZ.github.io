<!DOCTYPE html>
<html lang="en-us" >
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search Rui ZHAO's publications and pages.">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="/css/vendor-bundle.min.047268c6dd09ad74ba54a0ba71837064.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.2/css/academicons.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="/css/wowchemy.58fb15e2da83dd3f063d1db556f4a54e.css" />
  <link rel="stylesheet" href="/css/libs/chroma/github-light.min.css" />

  <style>
    :root {
      --apple-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Helvetica Neue", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --apple-bg: #f5f5f7; --apple-bg-elevated: #ffffff; --apple-text: #1d1d1f;
      --apple-text-secondary: #6e6e73; --apple-blue: #0071e3; --apple-blue-hover: #0077ed;
      --apple-border: #d2d2d7; --apple-blue-tint: rgba(0,113,227,0.1);
      --apple-card-shadow: 0 8px 30px rgba(0,0,0,0.08);
      --apple-radius-md: 18px; --apple-radius-pill: 980px;
      --apple-ease: cubic-bezier(0.32,0.72,0,1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --apple-bg:#000; --apple-bg-elevated:#1d1d1f; --apple-text:#f5f5f7;
        --apple-text-secondary:#a1a1a6; --apple-blue:#2997ff; --apple-border:#38383a;
        --apple-blue-tint:rgba(41,151,255,0.16); --apple-card-shadow:0 8px 30px rgba(0,0,0,0.5);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body { font-family: var(--apple-sans); background: var(--apple-bg); color: var(--apple-text);
      letter-spacing: -0.011em; line-height: 1.5; margin: 0; }
    a { color: var(--apple-blue); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .page-body { padding-top: 2rem; padding-bottom: 4rem; }
    .container { max-width: 860px; margin: 0 auto; padding: 0 1.25rem; }
    h1 { font-size: clamp(2rem,3.4vw,2.8rem); font-weight: 700; letter-spacing: -0.025em; margin: 0 0 .4rem; }
    .search-sub { color: var(--apple-text-secondary); margin: 0 0 1.6rem; font-size: 1.05rem; }
    .search-box { position: relative; margin-bottom: 1rem; }
    .search-box .fa-search { position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
      color: var(--apple-text-secondary); font-size: 1.05rem; }
    #search-input { width: 100%; font-family: var(--apple-sans); font-size: 1.08rem;
      padding: 0.95rem 1.1rem 0.95rem 3rem; border-radius: var(--apple-radius-pill);
      border: 1px solid var(--apple-border); background: var(--apple-bg-elevated);
      color: var(--apple-text); outline: none; transition: border-color 200ms var(--apple-ease),
      box-shadow 200ms var(--apple-ease); }
    #search-input:focus { border-color: var(--apple-blue); box-shadow: 0 0 0 4px var(--apple-blue-tint); }
    .search-stats { color: var(--apple-text-secondary); font-size: .92rem; margin: 0 0 1.1rem; min-height: 1.2rem; }
    .result-item { background: var(--apple-bg-elevated); border: 1px solid var(--apple-border);
      border-radius: var(--apple-radius-md); padding: 1.1rem 1.25rem; margin-bottom: .9rem;
      transition: box-shadow 240ms var(--apple-ease), transform 160ms var(--apple-ease), border-color 200ms var(--apple-ease); }
    .result-item:hover { box-shadow: var(--apple-card-shadow); transform: translateY(-2px); }
    .result-head { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
    .result-badge { color: var(--apple-blue); background: var(--apple-blue-tint); font-weight: 600;
      font-size: .82rem; padding: .15rem .6rem; border-radius: var(--apple-radius-pill); white-space: nowrap; }
    .result-title { font-size: 1.12rem; font-weight: 600; letter-spacing: -0.012em; color: var(--apple-text); }
    .result-title a { color: var(--apple-text); }
    .result-meta { color: var(--apple-text-secondary); font-size: .95rem; margin-top: .35rem; }
    .result-venue { color: var(--apple-text-secondary); font-size: .92rem; margin-top: .15rem; font-style: italic; }
    .result-type { font-size: .8rem; color: var(--apple-text-secondary); text-transform: uppercase;
      letter-spacing: .04em; margin-bottom: .25rem; }
    .result-item mark { background: var(--apple-blue-tint); color: var(--apple-blue); border-radius: 3px; padding: 0 2px; }
    .empty-state { color: var(--apple-text-secondary); text-align: center; padding: 3rem 1rem; }
    .site-footer { text-align: center; color: var(--apple-text-secondary); font-size: .85rem;
      padding: 2rem 1rem; }
    .site-footer a { color: var(--apple-text-secondary); }
  </style>
</head>
<body>
  <div class="page-body">
    <div class="container">
      <h1>Search</h1>
      <p class="search-sub">Search publications and pages by title, author, keyword or year.</p>

      <div class="search-box">
        <i class="fas fa-search" aria-hidden="true"></i>
        <input id="search-input" type="search" placeholder="e.g. blockchain, BIM, Digital Twin, Kong..."
          autocomplete="off" aria-label="Search" />
      </div>

      <div id="search-stats" class="search-stats"></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <div class="page-footer">
    <div class="container">
      <footer class="site-footer">
        <p>© 2025 Rui ZHAO — Published with Wowchemy</p>
      </footer>
    </div>
  </div>

  <script>
    const SEARCH_INDEX = [{"title": "A Blockchain 4.0-Digital Twin paradigm for prediction and reasoning in distributed construction project management", "authors": "R Zhao, L Kong, M Sun, F Xue", "year": "2026", "venue": "Computers &amp; Industrial Engineering", "type": "Journal", "url": "https://scholar.google.com/scholar?q=A+Blockchain+4.0-Digital+Twin+paradigm+for+prediction+and+reasoning+in+distributed+construction+project+management"}, {"title": "Superadditive cross-modal transistor neuron for a hybrid in-sensor computing system", "authors": "L Jinjie, L Xingji, W Zujun, Y Boyang, Y Lu, Y Rui, Z Rui, W Junlin, J Qi, C Zirong, N Yao, W Lei, L Yuan", "year": "2026", "venue": "SCIENCE CHINA Information Sciences", "type": "Journal", "url": "https://scholar.google.com/scholar?q=Superadditive+cross-modal+transistor+neuron+for+a+hybrid+in-sensor+computing+system"}, {"title": "Open BIM exchange on Blockchain 3.0 virtual disk: A traceable semantic differential transaction approach", "authors": "L Kong, R Zhao, CJ Anumba, W Lu, F Xue", "year": "2025", "venue": "Frontiers of Engineering Management", "type": "Journal", "url": "/publication/journal-article/kong25open.pdf"}, {"title": "The Opportunities and Challenges of Multimodal GenAI in the Construction Industry: A Brief Review", "authors": "M Sun, R Zhao, F Xue", "year": "2025", "venue": "Intelligence", "type": "Journal", "url": "/publication/conference-paper/sun24genai.pdf"}, {"title": "A blockchain 3.0 paradigm for digital twins in construction project management", "authors": "R Zhao, Z Chen, F Xue", "year": "2023", "venue": "Automation in Construction", "type": "Journal", "url": "/publication/journal-article/autocon-145/zhao23chainpm.pdf"}, {"title": "Rebuilding trust in the construction industry: a blockchain-based deployment framework", "authors": "W Lu, L Wu, R Zhao", "year": "2023", "venue": "International Journal of Construction Management", "type": "Journal", "url": "/publication/journal-article/ijcm-23-8/lu23rebuilding.pdf"}, {"title": "Automated Machine Learning in the smart construction era: Significance and accessibility for industrial classification and regression tasks", "authors": "R Zhao, Z Yang, D Liang, F Xue", "year": "2023", "venue": "28th International Symposium on Advancement of Construction Management and Real Estate", "type": "Conference", "url": "/publication/conference/zhao23automated.pdf"}, {"title": "A blockchain-based token economic model for incentivizing ESG in the construction industry", "authors": "R Zhao, J Wang, F Xue", "year": "2023", "venue": "EC3 Conference 2023", "type": "Conference", "url": "/publication/conference/EC32023_235.pdf"}, {"title": "Zero-Knowledge Proof for Trusted Construction Management: A Preliminary Study of Adaptive Blockchain BIM Identity Authentication", "authors": "L Kong, R Zhao, F Xue", "year": "2023", "venue": "The 23rd International Conference on Construction Applications of Virtual Reality", "type": "Journal", "url": "/publication/conference-paper/kong23zkp.pdf"}, {"title": "Blockchain-enabled IoT-BIM platform for supply chain management in modular construction", "authors": "X Li, W Lu, F Xue, L Wu, R Zhao, J Lou, J Xu", "year": "2022", "venue": "Journal of Construction Engineering and Management", "type": "Journal", "url": "/publication/journal-article/asce-jcemd4-148-2/li22platform1.pdf"}, {"title": "Linking permissioned blockchain to Internet of Things (IoT)-BIM platform for off-site production management in modular construction", "authors": "L Wu, W Lu, F Xue, X Li, R Zhao, M Tang", "year": "2022", "venue": "Computers in Industry", "type": "Journal", "url": "/publication/journal-article/wu22linking1.pdf"}, {"title": "Using blockchain to improve information sharing accuracy in the onsite assembly of modular construction", "authors": "L Wu, W Lu, R Zhao, J Xu, X Li, F Xue", "year": "2022", "venue": "Journal of Management in Engineering", "type": "Journal", "url": "/publication/journal-article/jme-38-3/wu22accuracy1.pdf"}, {"title": "A blockchain-based model with an incentive mechanism for cross-border logistics supervision and data sharing in modular construction", "authors": "L Wu, X Li, R Zhao, W Lu, J Xu, F Xue", "year": "2022", "venue": "Journal of Cleaner Production", "type": "Journal", "url": "/publication/journal-article/jcp-375-133460/wu22incentive.pdf"}, {"title": "When permissioned blockchain meets IoT oracles: An on-chain quality assurance system for off-shore modular construction manufacture", "authors": "L Kong, C Chen, R Zhao, Z Chen, L Wu, Z Yang, X Li, W Lu, F Xue", "year": "2022", "venue": "2022 IEEE 1st Global Emerging Technology Blockchain Forum: Blockchain", "type": "Conference", "url": "/publication/conference/kong22permissioned.pdf"}, {"title": "A study on protocols of cross-chain data synchronization for permission blockchain for construction management", "authors": "R Zhao, L Wu, Z Chen, M Tang, W Lu, F Xue", "year": "2022", "venue": "Proceedings of the 26th International Symposium on Advancement of Construction Management and Real Estate", "type": "Conference", "url": "/publication/conference/cricm-2022/zhao21protocol.pdf"}, {"title": "Exploring smart construction objects as blockchain oracles in construction supply chain management", "authors": "W Lu, X Li, F Xue, R Zhao, L Wu, AGO Yeh", "year": "2021", "venue": "Automation in Construction", "type": "Journal", "url": "/publication/journal-article/lu21oracle/lu21oracle.pdf"}, {"title": "Two-layer adaptive blockchain-based supervision model for off-site modular housing production", "authors": "X Li, L Wu, R Zhao, W Lu, F Xue", "year": "2021", "venue": "Computers in Industry", "type": "Journal", "url": "/publication/journal-article/li21tabs.pdf"}, {"title": "Blockchain technology for governmental supervision of construction work: Learning from digital currency electronic payment systems", "authors": "W Lu, L Wu, R Zhao, X Li, F Xue", "year": "2021", "venue": "Journal of Construction Engineering and Management", "type": "Journal", "url": "/publication/journal-article/lu21dcep.pdf"}, {"title": "Comparison of BIM Collaboration Paradigms for Digital Twin Readiness: Centralized Files, Decentralized Clouds, and Distributed Blockchains", "authors": "R Zhao, Y Wu, J Lou, Z Chen, L Wu, F Xue", "year": "2021", "venue": "Proceedings of the 38th International Conference of CIB W78", "type": "Conference", "url": "/publication/conference/cibw78-2021/zhao21w781.pdf"}, {"title": "Smart contract: Is it really smart in construction?", "authors": "L Wu, W Lu, R Zhao, F Xue", "year": "2021", "venue": "Proceedings of the 26th International Symposium on Advancement of Construction Management and Real Estate", "type": "Conference", "url": "/publication/conference/wu21contract.pdf"}, {"title": "Home", "authors": "", "year": "", "venue": "Homepage of Rui ZHAO", "type": "Page", "url": "/"}, {"title": "Publications", "authors": "", "year": "", "venue": "Full list of journal & conference papers", "type": "Page", "url": "/publication/"}, {"title": "Projects", "authors": "", "year": "", "venue": "Research & software projects", "type": "Page", "url": "/project/"}, {"title": "Teaching", "authors": "", "year": "", "venue": "Courses taught by Rui ZHAO", "type": "Page", "url": "/teaching/"}, {"title": "Honors & Activities", "authors": "", "year": "", "venue": "Awards, service and academic activities", "type": "Page", "url": "/honors/"}];

    const input = document.getElementById('search-input');
    const results = document.getElementById('search-results');
    const stats = document.getElementById('search-stats');
    const params = new URLSearchParams(window.location.search);
    const fuse = null;

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function highlight(text, q) {
      if (!q) return escapeHtml(text);
      const safe = escapeHtml(text);
      try {
        const re = new RegExp('(' + q.replace(/[.*+?^${}|[]\\]/g, '\\$&') + ')', 'ig');
        return safe.replace(re, '<mark>$1</mark>');
      } catch (e) { return safe; }
    }

    function norm(s) { return (s || '').toLowerCase(); }

    function runSearch(q) {
      q = (q || '').trim();
      if (!q) {
        stats.textContent = SEARCH_INDEX.length + ' indexed items. Type to filter.';
        render(SEARCH_INDEX.slice(0, 12), q, true);
        return;
      }
      const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      const hits = SEARCH_INDEX.filter(it => {
        const hay = norm(it.title) + ' ' + norm(it.authors) + ' ' + norm(it.venue)
          + ' ' + norm(it.type) + ' ' + norm(it.year);
        return terms.every(t => hay.includes(t));
      });
      // rank: title match first, then author, then venue
      hits.sort((a, b) => score(b, terms) - score(a, terms));
      stats.textContent = hits.length + ' result' + (hits.length === 1 ? '' : 's') + ' for “' + q + '”';
      render(hits, q, false);
    }

    function score(it, terms) {
      const t = norm(it.title), a = norm(it.authors), v = norm(it.venue);
      let s = 0;
      terms.forEach(term => {
        if (t.includes(term)) s += 3;
        if (a.includes(term)) s += 2;
        if (v.includes(term)) s += 1;
      });
      return s;
    }

    function render(items, q, preview) {
      results.innerHTML = '';
      if (!items.length) {
        const d = document.createElement('div');
        d.className = 'empty-state';
        d.textContent = 'No matches. Try a different keyword.';
        results.appendChild(d);
        return;
      }
      items.forEach(it => {
        const card = document.createElement('div');
        card.className = 'result-item';
        const isPub = it.type && it.type !== 'Page';
        const badge = it.year ? `<span class="result-badge">${it.year}</span>` : '';
        const typeLine = isPub ? `<div class="result-type">${escapeHtml(it.type)}</div>` : '';
        const meta = it.authors ? `<div class="result-meta">${highlight(it.authors, q)}</div>` : '';
        const venue = it.venue ? `<div class="result-venue">${highlight(it.venue, q)}</div>` : '';
        card.innerHTML =
          typeLine +
          `<div class="result-head">` + badge +
            `<div class="result-title"><a href="${escapeHtml(it.url)}">${highlight(it.title, q)}</a></div>` +
          `</div>` +
          meta + venue;
        results.appendChild(card);
      });
    }

    const initial = params.get('q') || '';
    input.value = initial;
    input.addEventListener('input', e => {
      const v = e.target.value;
      const newUrl = v ? '?q=' + encodeURIComponent(v) : window.location.pathname;
      history.replaceState(null, '', newUrl);
      runSearch(v);
    });
    runSearch(initial);
    if (initial) input.focus();
    setTimeout(() => input.focus(), 50);
  </script>
</body>
</html>
