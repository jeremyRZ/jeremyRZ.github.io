<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf8">
    <title>W11: Spring Boot Core Simulator | SE112</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font: 16px Arial; padding: 20px; margin: 0; }
        h1 { color: #38bdf8; margin: 0 0 10px 0; }
        p { color: #94a3b8; margin: 0 0 30px 0; }
        .grid { display: flex; gap: 20px; margin: 0 0 30px 0; }
        .card { background: #1e293b; padding: 25px; flex: 1; border: 2px solid #334155; }
        h2 { color: #fde047; font: 20px Arial; margin: 0 0 20px 0; }
        .check_row { margin: 0 0 15px 0; display: flex; }
        .tag_box { background: #064e3b; color: #6ee7b7; padding: 15px; font: 14px monospace; margin: 15px 0 0 0; border: 1px solid #059669; line_height: 1.5; }
        .server_info { background: #4338ca; color: #e0e7ff; padding: 15px; margin: 20px 0 0 0; border: 1px solid #4f46e5; line_height: 1.5; }
        .btn { background: #10b981; color: white; border: none; padding: 15px; font: bold 18px Arial; cursor: pointer; width: 100%; margin: 0 0 20px 0; transition: 0.2s; }
        .btn:hover { background: #059669; }
        .console { background: #000; color: #4ade80; padding: 15px; font: 14px monospace; height: 180px; overflow: auto; border: 2px solid #3b82f6; }
        .log_msg { margin: 0 0 8px 0; }
        .log_warn { color: #facc15; margin: 0 0 8px 0; font_weight: bold; }
    </style>
<!-- Apple SE112 theme -->
    <link rel="stylesheet" href="../css/apple-se112.css" />
</head>
<body>
    <h1>⚙️ Spring Boot 核心機制模擬器</h1>
    <p>探索 Starter 依賴解析與內嵌伺服器的強大威力</p>

    <div class="grid">
        <div class="card" id="card_deps">
            <h2>📦 1. 選擇 Starter 起步依賴</h2>
            <div class="check_row">
                <input type="checkbox" id="chk_web" checked>
                <label>spring_boot_starter_web</label>
            </div>
            <div class="check_row">
                <input type="checkbox" id="chk_jpa">
                <label>spring_boot_starter_data_jpa</label>
            </div>
            <div class="check_row">
                <input type="checkbox" id="chk_sec">
                <label>spring_boot_starter_security</label>
            </div>
            <div class="tag_box" id="dep_list">
                等待解析...
            </div>
        </div>

        <div class="card" id="card_server">
            <h2>🌐 2. 配置內嵌伺服器</h2>
            <div class="check_row">
                <input type="radio" name="server" id="rad_tomcat" value="tomcat" checked>
                <label>Tomcat (預設容器)</label>
            </div>
            <div class="check_row">
                <input type="radio" name="server" id="rad_jetty" value="jetty">
                <label>Jetty (輕量級)</label>
            </div>
            <div class="check_row">
                <input type="radio" name="server" id="rad_undertow" value="undertow">
                <label>Undertow (高效能)</label>
            </div>
            <div class="server_info" id="server_details">
                讀取中...
            </div>
        </div>
    </div>

    <button class="btn" id="run_btn">🚀 執行 java jar (啟動應用程式)</button>

    <div class="console" id="virtual_console">
        <div class="log_msg">系統提示：請選擇左側與上方的配置後，點擊啟動按鈕...</div>
    </div>

    <script>
        const cards = document.getElementsByClassName('card');
        for(let i=0; i<cards.length; i++) {
            cards[i].style.borderRadius = '12px';
        }
        
        const rows = document.getElementsByClassName('check_row');
        for(let i=0; i<rows.length; i++) {
            rows[i].style.alignItems = 'center';
            rows[i].style.gap = '10px';
        }

        document.getElementById('dep_list').style.borderRadius = '8px';
        document.getElementById('server_details').style.borderRadius = '8px';
        document.getElementById('run_btn').style.borderRadius = '8px';
        document.getElementById('virtual_console').style.borderRadius = '8px';

        const starters = {
            web: ["spring_webmvc", "spring_context", "jackson_databind", "tomcat_embed"],
            jpa: ["hibernate_core", "spring_data_jpa", "HikariCP"],
            sec: ["spring_security_core", "spring_security_web"]
        };

        const servers = {
            tomcat: { name: "Tomcat", time: "2.1s", mem: "45MB", desc: "Default, mature & stable" },
            jetty: { name: "Jetty", time: "1.8s", mem: "38MB", desc: "Lightweight, async support" },
            undertow: { name: "Undertow", time: "1.5s", mem: "32MB", desc: "NIO non_blocking, high performance" }
        };

        const chkWeb = document.getElementById('chk_web');
        const chkJpa = document.getElementById('chk_jpa');
        const chkSec = document.getElementById('chk_sec');
        const depList = document.getElementById('dep_list');

        const radTomcat = document.getElementById('rad_tomcat');
        const radJetty = document.getElementById('rad_jetty');
        const radUndertow = document.getElementById('rad_undertow');
        const serverDetails = document.getElementById('server_details');

        const runBtn = document.getElementById('run_btn');
        const consoleDiv = document.getElementById('virtual_console');

        function updateDeps() {
            let resolved = [];
            if (chkWeb.checked) { resolved = resolved.concat(starters.web); }
            if (chkJpa.checked) { resolved = resolved.concat(starters.jpa); }
            if (chkSec.checked) { resolved = resolved.concat(starters.sec); }

            if (resolved.length === 0) {
                depList.innerHTML = "尚未選擇 Starter";
            } else {
                let html = "<b>BOM 版本控制啟動：無衝突</b><br><br>向下解析到的傳遞性依賴：<br>";
                for (let i = 0; i < resolved.length; i++) {
                    html += "✦ " + resolved[i] + "<br>";
                }
                depList.innerHTML = html;
            }
        }

        function updateServer() {
            let selected = 'tomcat';
            if (radJetty.checked) selected = 'jetty';
            if (radUndertow.checked) selected = 'undertow';

            const s = servers[selected];
            let info = "<b>" + s.name + " 容器規格：</b><br>";
            info += "啟動時間: " + s.time + "<br>";
            info += "記憶體消耗: " + s.mem + "<br>";
            info += "特性: " + s.desc + "<br>";

            if (selected !== 'tomcat') {
                info += "<br><span style='color:#facc15;'>注意：已排除預設 Tomcat，改用 " + s.name + " starter</span>";
            }

            serverDetails.innerHTML = info;
        }

        chkWeb.addEventListener('change', updateDeps);
        chkJpa.addEventListener('change', updateDeps);
        chkSec.addEventListener('change', updateDeps);

        radTomcat.addEventListener('change', updateServer);
        radJetty.addEventListener('change', updateServer);
        radUndertow.addEventListener('change', updateServer);

        function printLog(msg, isWarn) {
            const line = document.createElement('div');
            line.className = isWarn ? 'log_warn' : 'log_msg';
            line.innerHTML = ">> " + msg;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        runBtn.addEventListener('click', function() {
            runBtn.disabled = true;
            runBtn.style.opacity = '0.5';
            consoleDiv.innerHTML = '';
            printLog("開始執行 Spring Boot 應用程式...");

            let selected = 'tomcat';
            if (radJetty.checked) selected = 'jetty';
            if (radUndertow.checked) selected = 'undertow';
            const s = servers[selected];

            setTimeout(function() {
                printLog("正在根據 POM 檔案解析依賴樹與 BOM 版本...");
            }, 600);

            setTimeout(function() {
                printLog("初始化 Spring 容器 (ApplicationContext)...");
            }, 1200);

            setTimeout(function() {
                printLog("準備啟動內嵌式伺服器 " + s.name + "...");
            }, 1800);

            setTimeout(function() {
                printLog("Application 啟動成功！總耗時: " + s.time + "，佔用記憶體: " + s.mem, true);
                runBtn.disabled = false;
                runBtn.style.opacity = '1';
            }, 2800);
        });

        updateDeps();
        updateServer();

    </script>
</body>
</html>
